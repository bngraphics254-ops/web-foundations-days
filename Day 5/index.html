<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Load and Filter Users</title>
  <script src="users.js" defer></script>
</head>
<body>
  <main>
    <h1>Users</h1>

    <button id="load-users" type="button">Load users</button>

    <label for="filter-input">Filter by name</label>
    <input id="filter-input" type="search">

    <p id="status" aria-live="polite">Select “Load users” to get started.</p>
    <ul id="users-list" aria-label="Users"></ul>
  </main>
</body>
</html>
