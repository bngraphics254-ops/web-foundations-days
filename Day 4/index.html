<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Note Counter</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <main>
    <h1>Note Counter</h1>

    <label for="note-text">Your note</label>
    <textarea id="note-text" rows="8" placeholder="Start typing your note..."></textarea>

    <p id="char-count" class="counter">Characters: 0</p>
    <p id="word-count" class="counter">Words: 0</p>

    <button id="clear-btn" type="button">Clear</button>
    <button id="theme-toggle" type="button">Toggle theme</button>
  </main>
</body>
</html>
